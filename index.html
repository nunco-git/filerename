<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>문서 정보 기반 정밀 파일명 자동 변경기</title>
  <!-- CDN 스크립트 로드 -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f8f9fa; }
    .container { max-width: 1080px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { border-bottom: 2px solid #007bff; padding-bottom: 10px; color: #333; margin-top: 0; }
    .rule-card { background: #f1f5f9; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #007bff; }
    .rule-card h4 { margin: 0 0 10px 0; color: #007bff; }
    .rule-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; align-items: center; }
    label { font-size: 13px; font-weight: bold; color: #495057; display: block; margin-bottom: 4px; }
    input[type="text"], select { width: 100%; padding: 6px; border: 1px solid #ced4da; border-radius: 4px; box-sizing: border-box; font-size: 13px; }
    
    .drop-zone { 
      border: 2px dashed #007bff; 
      background: #e9f2ff; 
      border-radius: 8px; 
      padding: 30px; 
      text-align: center; 
      color: #007bff; 
      font-weight: bold; 
      cursor: pointer; 
      margin-top: 15px; 
      transition: all 0.2s ease;
    }
    .drop-zone.dragover { background: #d0e3ff; border-color: #0056b3; transform: scale(0.99); }

    .action-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; gap: 10px; flex-wrap: wrap; }
    .btn-group { display: flex; gap: 8px; }
    .btn { padding: 10px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; transition: 0.2s; }
    .btn-run { background: #007bff; color: white; }
    .btn-run:hover { background: #0056b3; }
    .btn-re { background: #17a2b8; color: white; }
    .btn-re:hover { background: #117a8b; }
    .btn-clear { background: #dc3545; color: white; }
    .btn-clear:hover { background: #bd2130; }
    .btn-zip { background: #28a745; color: white; }
    .btn-zip:hover { background: #218838; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 13px; }
    th { background-color: #f2f2f2; }
    
    .status-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .status-ready { background: #e2e3e5; color: #383d41; }
    .status-working { background: #fff3cd; color: #856404; }
    .status-success { background: #d4edda; color: #155724; }
    .status-error { background: #f8d7da; color: #721c24; }

    .btn-sm { padding: 4px 8px; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; background: #28a745; color: white; }
    .btn-sm:hover { background: #218838; }
    
    .help-text { font-size: 12px; color: #6c757d; margin-top: 4px; }
  </style>
</head>
<body>

<div class="container">
  <h2>문서 정보 기반 정밀 파일명 자동 변경기</h2>

  <!-- 추출 규칙 1 -->
  <div class="rule-card">
    <h4>추출 위치 1 설정</h4>
    <div class="rule-grid">
      <div>
        <label>기준 단어(키워드)</label>
        <input type="text" id="key1" value="성명" placeholder="예: 성명, 신청인">
      </div>
      <div>
        <label>탐색 방식</label>
        <select id="dir1">
          <option value="after" selected>기준 단어 뒤</option>
          <option value="before">기준 단어 앞</option>
          <option value="nextLine">기준 단어 바로 다음 줄 전체</option>
        </select>
      </div>
      <div>
        <label>중복 시 순번</label>
        <select id="idx1">
          <option value="1" selected>첫 번째</option>
          <option value="2">두 번째</option>
          <option value="last">마지막</option>
        </select>
      </div>
      <div>
        <label>추출 범위</label>
        <select id="range1">
          <option value="word" selected>다음 공백 전까지(1단어)</option>
          <option value="line">해당 줄 끝까지</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 추출 규칙 2 -->
  <div class="rule-card">
    <h4>추출 위치 2 설정</h4>
    <div class="rule-grid">
      <div>
        <label>기준 단어(키워드)</label>
        <input type="text" id="key2" value="기관명" placeholder="예: 기관명, 주소">
      </div>
      <div>
        <label>탐색 방식</label>
        <select id="dir2">
          <option value="after" selected>기준 단어 뒤</option>
          <option value="before">기준 단어 앞</option>
          <option value="nextLine">기준 단어 바로 다음 줄 전체</option>
        </select>
      </div>
      <div>
        <label>중복 시 순번</label>
        <select id="idx2">
          <option value="1" selected>첫 번째</option>
          <option value="2">두 번째</option>
          <option value="last">마지막</option>
        </select>
      </div>
      <div>
        <label>추출 범위</label>
        <select id="range2">
          <option value="word">다음 공백 전까지(1단어)</option>
          <option value="line" selected>해당 줄 끝까지</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 추출 규칙 3 -->
  <div class="rule-card">
    <h4>추출 위치 3 설정 (선택)</h4>
    <div class="rule-grid">
      <div>
        <label>기준 단어(키워드)</label>
        <input type="text" id="key3" value="" placeholder="미사용 시 비워둠">
      </div>
      <div>
        <label>탐색 방식</label>
        <select id="dir3">
          <option value="after" selected>기준 단어 뒤</option>
          <option value="before">기준 단어 앞</option>
          <option value="nextLine">기준 단어 바로 다음 줄 전체</option>
        </select>
      </div>
      <div>
        <label>중복 시 순번</label>
        <select id="idx3">
          <option value="1" selected>첫 번째</option>
          <option value="2">두 번째</option>
          <option value="last">마지막</option>
        </select>
      </div>
      <div>
        <label>추출 범위</label>
        <select id="range3">
          <option value="word" selected>다음 공백 전까지(1단어)</option>
          <option value="line">해당 줄 끝까지</option>
        </select>
      </div>
    </div>
    <div class="help-text">※ 단어 사이에 '성 명', '성   명'처럼 띄어쓰기가 들어있어도 자동으로 인식하여 값을 가져옵니다.</div>
  </div>

  <div class="drop-zone" id="dropZone">
    📂 파일을 마우스로 끌어다 넣거나, 이곳을 클릭하여 선택하세요. (PDF, HWPX)
    <input type="file" id="fileInput" multiple accept=".pdf,.hwpx" style="display:none;">
  </div>

  <div class="action-bar">
    <div class="btn-group">
      <button class="btn btn-run" id="btnRun" onclick="runBatchProcess(false)" disabled>▶ 파일 분석 및 변경 실행</button>
      <button class="btn btn-re" id="btnRe" onclick="runBatchProcess(true)" disabled>🔄 재실행 (현재 목록 재분석)</button>
      <button class="btn btn-clear" id="btnClear" onclick="clearAllFiles()">🗑️ 전체 초기화</button>
    </div>
    <div>
      <button class="btn btn-zip" id="btnZip" onclick="downloadAllZip()" disabled>📦 전체 ZIP 일괄 다운로드</button>
    </div>
  </div>

  <h3>업로드 파일 목록 및 실행 결과</h3>
  <table id="resultTable">
    <thead>
      <tr>
        <th style="width: 20%;">원본 파일명</th>
        <th style="width: 12%;">추출값 1</th>
        <th style="width: 12%;">추출값 2</th>
        <th style="width: 12%;">추출값 3</th>
        <th style="width: 24%;">변경될 파일명</th>
        <th style="width: 20%;">상태 / 개별 다운로드</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
  // Worker 글로벌 설정 (GitHub Pages 호환)
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  }

  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const btnRun = document.getElementById('btnRun');
  const btnRe = document.getElementById('btnRe');
  const btnZip = document.getElementById('btnZip');
  const resultTable = document.getElementById('resultTable').querySelector('tbody');

  let fileQueue = [];

  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) handleFiles(e.target.files);
  });

  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
    dropZone.addEventListener(eventName, preventDefaults, false);
    document.body.addEventListener(eventName, preventDefaults, false);
  });

  function preventDefaults(e) {
    e.preventDefault();
    e.stopPropagation();
  }

  ['dragenter', 'dragover'].forEach(eventName => {
    dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
  });

  ['dragleave', 'drop'].forEach(eventName => {
    dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
  });

  dropZone.addEventListener('drop', (e) => {
    const dt = e.dataTransfer;
    const files = dt.files;
    if (files && files.length > 0) {
      handleFiles(files);
    }
  }, false);

  function handleFiles(files) {
    for (let file of files) {
      const name = file.name.toLowerCase();
      if (!name.endsWith('.pdf') && !name.endsWith('.hwpx')) continue;

      if (!fileQueue.some(item => item.file.name === file.name)) {
        const item = { file: file, status: 'ready', newName: '', extractedText: null };
        fileQueue.push(item);
        renderRow(item);
      }
    }
    updateButtonStates();
  }

  function renderRow(item) {
    const row = resultTable.insertRow();
    const safeId = 'row_' + Math.random().toString(36).substr(2, 9);
    item.rowId = safeId;
    row.id = safeId;
    row.innerHTML = `
      <td>${item.file.name}</td>
      <td class="val-1">-</td>
      <td class="val-2">-</td>
      <td class="val-3">-</td>
      <td class="val-new">-</td>
      <td class="val-status"><span class="status-badge status-ready">대기 중</span></td>
    `;
  }

  // 초기화 기능
  function clearAllFiles() {
    fileQueue = [];
    resultTable.innerHTML = '';
    fileInput.value = '';
    updateButtonStates();
  }

  function updateButtonStates() {
    const hasFiles = fileQueue.length > 0;
    btnRun.disabled = !hasFiles;
    btnRe.disabled = !hasFiles;
    btnZip.disabled = !fileQueue.some(i => i.status === 'success');
  }

  // 작업 실행 / 재실행
  async function runBatchProcess(isReRun = false) {
    btnRun.disabled = true;
    btnRe.disabled = true;
    btnZip.disabled = true;

    const rules = [
      { key: document.getElementById('key1').value.trim(), dir: document.getElementById('dir1').value, idx: document.getElementById('idx1').value, range: document.getElementById('range1').value },
      { key: document.getElementById('key2').value.trim(), dir: document.getElementById('dir2').value, idx: document.getElementById('idx2').value, range: document.getElementById('range2').value },
      { key: document.getElementById('key3').value.trim(), dir: document.getElementById('dir3').value, idx: document.getElementById('idx3').value, range: document.getElementById('range3').value }
    ];

    for (let item of fileQueue) {
      if (!isReRun && item.status === 'success') continue;

      const row = document.getElementById(item.rowId);
      if (!row) continue;
      const statusCell = row.querySelector('.val-status');

      statusCell.innerHTML = `<span class="status-badge status-working">분석 중...</span>`;

      try {
        if (!item.extractedText || isReRun) {
          if (item.file.name.toLowerCase().endsWith('.pdf')) {
            item.extractedText = await extractPdfText(item.file);
            if (item.extractedText.trim().length < 20 && window.Tesseract) {
              statusCell.innerHTML = `<span class="status-badge status-working">OCR 스캔 중...</span>`;
              item.extractedText = await extractPdfOCR(item.file);
            }
          } else if (item.file.name.toLowerCase().endsWith('.hwpx')) {
            item.extractedText = await extractHwpxText(item.file);
          }
        }

        const vals = rules.map(rule => parseTextByRule(item.extractedText, rule));
        row.querySelector('.val-1').innerText = vals[0] || "-";
        row.querySelector('.val-2').innerText = vals[1] || "-";
        row.querySelector('.val-3').innerText = vals[2] || "-";

        const ext = item.file.name.substring(item.file.name.lastIndexOf('.'));
        const cleanBaseName = item.file.name.replace(ext, '');
        
        // 1. 값 각각의 양끝 언더바/공백 정제 및 미확인/빈값 필터링
        const validParts = vals
          .map(v => v ? v.trim().replace(/^[_]+|[_]+$/g, '') : "")
          .filter(v => v !== "" && v !== "미확인");

        // 2. 유효한 값만 단일 언더바(_)로 연결하여 파일명 생성
        if (validParts.length > 0) {
          const prefix = validParts.join('_');
          item.newName = `[${prefix}]_${cleanBaseName}${ext}`;
        } else {
          item.newName = item.file.name;
        }

        row.querySelector('.val-new').innerText = item.newName;
        item.status = 'success';

        const btnDownload = document.createElement('button');
        btnDownload.className = 'btn-sm';
        btnDownload.innerText = '다운로드';
        btnDownload.onclick = () => triggerDownload(item.file, item.newName);

        statusCell.innerHTML = `<span class="status-badge status-success">완료</span> `;
        statusCell.appendChild(btnDownload);

      } catch (err) {
        console.error(err);
        item.status = 'error';
        statusCell.innerHTML = `<span class="status-badge status-error">실패</span>`;
      }
    }

    updateButtonStates();
  }

  // 띄어쓰기 유연 탐색 및 구문 분석 엔진
  function parseTextByRule(text, rule) {
    if (!rule.key || !text) return "";

    // 키워드 글자 사이에 정규식 공백 처리 (예: "성명" -> "성\s*명")
    const flexibleKey = rule.key.split('').map(char => {
      return /[a-zA-Z0-9가-힣]/.test(char) ? char + '\\s*' : char;
    }).join('').replace(/\\s\*$/, '');

    const matches = [...text.matchAll(new RegExp(flexibleKey, 'gi'))];
    if (matches.length === 0) return "미확인";

    let targetMatch = rule.idx === "last" ? matches[matches.length - 1] : (matches[parseInt(rule.idx) - 1] || matches[0]);
    const keyPos = targetMatch.index;
    const matchedTextLength = targetMatch[0].length;

    if (rule.dir === "nextLine") {
      const textAfter = text.substring(keyPos + matchedTextLength);
      const lines = textAfter.split(/[\r\n]+/).map(l => l.trim()).filter(l => l.length > 0);
      return lines.length > 0 ? cleanValue(lines[0]) : "미확인";
    } else if (rule.dir === "after") {
      const targetSlice = text.substring(keyPos + matchedTextLength).replace(/^[\s:]+/, '');
      if (rule.range === "word") {
        const m = targetSlice.match(/^[^\s]+/);
        return m ? cleanValue(m[0]) : "미확인";
      } else {
        const m = targetSlice.match(/^[^\r\n]+/);
        return m ? cleanValue(m[0]) : "미확인";
      }
    } else { // before
      const targetSlice = text.substring(0, keyPos);
      if (rule.range === "word") {
        const words = targetSlice.trim().split(/\s+/);
        return words.length > 0 ? cleanValue(words[words.length - 1]) : "미확인";
      } else {
        const lines = targetSlice.split(/[\r\n]+/);
        return lines.length > 0 ? cleanValue(lines[lines.length - 1]) : "미확인";
      }
    }
  }

  // 정밀 정제 함수: 마침표, 따옴표, 콜론, 불필요한 언더바 및 개행 문자 정제
  function cleanValue(val) {
    if (!val) return "";
    return val
      .replace(/[\r\n\t]+/g, ' ')
      .replace(/[:;,"'`_]+/g, '')
      .replace(/^\s+|\s+$/g, '')
      .trim();
  }

  async function extractPdfText(file) {
    if (!window.pdfjsLib) return "";
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    let fullText = "";
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const textContent = await page.getTextContent();
      fullText += textContent.items.map(item => item.str).join(" ") + "\n";
    }
    return fullText;
  }

  async function extractPdfOCR(file) {
    if (!window.pdfjsLib || !window.Tesseract) return "";
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    const page = await pdf.getPage(1);
    const viewport = page.getViewport({ scale: 1.5 });
    const canvas = document.createElement('canvas');
    const context = canvas.getContext('2d');
    canvas.height = viewport.height;
    canvas.width = viewport.width;
    await page.render({ canvasContext: context, viewport: viewport }).promise;

    const worker = await Tesseract.createWorker('kor+eng');
    const ret = await worker.recognize(canvas);
    await worker.terminate();
    return ret.data.text;
  }

  async function extractHwpxText(file) {
    if (!window.JSZip) return "";
    const zip = await JSZip.loadAsync(file);
    let fullText = "";
    for (let filename of Object.keys(zip.files)) {
      if (filename.startsWith("Contents/section") && filename.endsWith(".xml")) {
        const xmlText = await zip.files[filename].async("string");
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");
        fullText += xmlDoc.textContent + "\n";
      }
    }
    return fullText;
  }

  function triggerDownload(file, newName) {
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url;
    a.download = newName;
    a.click();
  }

  async function downloadAllZip() {
    if (!window.JSZip) return;
    const zip = new JSZip();
    const successItems = fileQueue.filter(i => i.status === 'success');

    for (let item of successItems) {
      zip.file(item.newName, item.file);
    }

    const content = await zip.generateAsync({ type: "blob" });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(content);
    a.download = "파일명_변경_완료_목록.zip";
    a.click();
  }
</script>

</body>
</html>
