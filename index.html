<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>설정 관리 및 클라우드 동기화</title>
  <!-- Firebase App & Firestore / Auth SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      GoogleAuthProvider, 
      signInWithPopup, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      getDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. Firebase Config 설정 (본인의 프로젝트 정보로 변경 필요)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Firebase 초기화
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 사용자 상태 저장
    window.currentUser = null;

    // Google 로그인
    window.loginWithGoogle = async function() {
      const provider = new GoogleAuthProvider();
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        console.error("로그인 실패:", error);
        alert("로그인 중 오류가 발생했습니다: " + error.message);
      }
    };

    // 로그아웃
    window.logout = async function() {
      try {
        await signOut(auth);
      } catch (error) {
        console.error("로그아웃 실패:", error);
      }
    };

    // 클라우드 저장 및 목록 자동 갱신 함수
    window.savePresetToCloud = async function(presetName, configData, isDefault = false) {
      if (!window.currentUser) {
        alert("로그인이 필요합니다.");
        return false;
      }
      const userRef = doc(db, "users", window.currentUser.uid);
      
      try {
        if (isDefault) {
          await setDoc(userRef, { defaultConfig: configData }, { merge: true });
        } else {
          // 객체 중첩 덮어쓰기 방지를 위한 merge 사용
          await setDoc(userRef, { 
            presets: { 
              [presetName]: configData 
            } 
          }, { merge: true });
        }
        
        // 저장 후 클라우드 데이터를 다시 불러와 목록 즉시 자동 갱신
        await window.loadUserDataFromCloud();
        alert("성공적으로 저장되었습니다.");
        return true;
      } catch (err) {
        console.error("클라우드 저장 오류:", err);
        alert("클라우드 저장에 실패했습니다. (Firestore 보안 규칙 및 네트워크를 확인하세요)");
        return false;
      }
    };

    // 클라우드 데이터 불러오기 함수
    window.loadUserDataFromCloud = async function() {
      if (!window.currentUser) return;
      const userRef = doc(db, "users", window.currentUser.uid);
      try {
        const docSnap = await getDoc(userRef);

        if (docSnap.exists()) {
          const data = docSnap.data();
          
          if (data.defaultConfig && typeof window.applyConfigData === 'function') {
            window.applyConfigData(data.defaultConfig);
          }

          // 목록 드롭다운 갱신
          if (typeof window.refreshPresetDropdownFromData === 'function') {
            window.refreshPresetDropdownFromData(data.presets || {});
          }
        } else {
          if (typeof window.refreshPresetDropdownFromData === 'function') {
            window.refreshPresetDropdownFromData({});
          }
        }
      } catch(err) {
        console.error("클라우드 불러오기 오류:", err);
      }
    };

    // 인증 상태 감지
    onAuthStateChanged(auth, (user) => {
      const loginBtn = document.getElementById('loginBtn');
      const logoutBtn = document.getElementById('logoutBtn');
      const userInfo = document.getElementById('userInfo');

      if (user) {
        window.currentUser = user;
        if(loginBtn) loginBtn.style.display = 'none';
        if(logoutBtn) logoutBtn.style.display = 'inline-block';
        if(userInfo) userInfo.textContent = `${user.displayName || user.email}님 환영합니다.`;
        
        // 로그인 성공 시 사용자 클라우드 저장 데이터 자동 로드
        window.loadUserDataFromCloud();
      } else {
        window.currentUser = null;
        if(loginBtn) loginBtn.style.display = 'inline-block';
        if(logoutBtn) logoutBtn.style.display = 'none';
        if(userInfo) userInfo.textContent = '로그인이 필요합니다.';
        if (typeof window.refreshPresetDropdownFromData === 'function') {
          window.refreshPresetDropdownFromData({});
        }
      }
    });

    // 화면 컨트롤용 UI 가상 핸들러 (실제 프로젝트 환경에 맞게 커스텀 가능)
    window.refreshPresetDropdownFromData = function(presets) {
      const select = document.getElementById('presetSelect');
      if (!select) return;
      select.innerHTML = '<option value="">-- 저장된 설정 선택 --</option>';
      
      Object.keys(presets).forEach(name => {
        const option = document.createElement('option');
        option.value = name;
        option.textContent = name;
        select.appendChild(option);
      });
      window.loadedPresets = presets;
    };

    window.applyConfigData = function(config) {
      console.log("기본 설정 적용됨:", config);
    };
  </script>
</head>
<body>
  <h2>클라우드 설정 동기화 시스템</h2>
  
  <!-- 로그인 / 사용자 정보 영역 -->
  <div id="authSection" style="margin-bottom: 20px;">
    <button id="loginBtn" onclick="loginWithGoogle()">Google 로그인</button>
    <button id="logoutBtn" onclick="logout()" style="display:none;">로그아웃</button>
    <span id="userInfo" style="margin-left: 10px;">상태 확인 중...</span>
  </div>

  <hr>

  <!-- 설정 저장 및 불러오기 UI 영역 -->
  <div id="presetSection" style="margin-top: 20px;">
    <h3>설정 저장 / 불러오기</h3>
    
    <div>
      <label for="presetNameInput">설정 이름: </label>
      <input type="text" id="presetNameInput" placeholder="예: 작업용 설정 1">
      <button onclick="handleSaveClick()">클라우드에 저장</button>
    </div>

    <div style="margin-top: 15px;">
      <label for="presetSelect">저장된 목록: </label>
      <select id="presetSelect" onchange="handleSelectChange(this)">
        <option value="">-- 저장된 설정 선택 --</option>
      </select>
    </div>
  </div>

  <script>
    // 버튼 클릭 이벤트 핸들러
    async function handleSaveClick() {
      const nameInput = document.getElementById('presetNameInput');
      const name = nameInput.value.trim();
      
      if (!name) {
        alert("설정 이름을 입력하세요.");
        return;
      }

      // 저장할 임의 데이터 예시 (프로젝트의 실제 설정 데이터 객체로 교체)
      const sampleConfigData = {
        theme: "dark",
        fontSize: 14,
        updatedAt: new Date().toISOString()
      };

      const success = await window.savePresetToCloud(name, sampleConfigData, false);
      if (success) {
        nameInput.value = '';
      }
    }

    // 목록 선택 변경 시 이벤트
    function handleSelectChange(select) {
      const selectedName = select.value;
      if (selectedName && window.loadedPresets && window.loadedPresets[selectedName]) {
        const config = window.loadedPresets[selectedName];
        alert(`'${selectedName}' 설정을 불러왔습니다:\n` + JSON.stringify(config, null, 2));
      }
    }
  </script>
</body>
</html>
