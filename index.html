<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>문서 정보 기반 정밀 파일명 자동 변경기</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f8f9fa; }
    .container { max-width: 1050px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { border-bottom: 2px solid #007bff; padding-bottom: 10px; color: #333; margin-top: 0; }
    .rule-card { background: #f1f5f9; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #007bff; }
    .rule-card h4 { margin: 0 0 10px 0; color: #007bff; }
    .rule-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; align-items: center; }
    label { font-size: 13px; font-weight: bold; color: #495057; display: block; margin-bottom: 4px; }
    input[type="text"], select { width: 100%; padding: 6px; border: 1px solid #ced4da; border-radius: 4px; box-sizing: border-box; font-size: 13px; }
    
    .drop-zone { border: 2px dashed #007bff; background: #e9f2ff; border-radius: 8px; padding: 30px; text-align: center; color: #007bff; font-weight: bold; cursor: pointer; margin-top: 15px; }
    .drop-zone:hover { background: #d0e3ff; }

    .action-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; gap: 10px; }
    .btn { padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; }
    .btn-run { background: #007bff; color: white; }
    .btn-run:hover { background: #0056b3; }
    .btn-zip { background: #28a745; color: white; }
    .btn-zip:hover { background: #218838; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 13px; }
    th { background-color: #f2f2f2; }
    
    .status-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .status-ready { background: #e2e3e5; color: #383d41; }
    .status-working { background: #fff3cd; color: #856404; }
    .status-success { background: #d4edda; color: #155724; }
    .status-error { background: #f8d7da; color: #721c24; }

    .btn-sm { padding: 4px 8px; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; background: #17a2b8; color: white; }
    .btn-sm:hover { background: #138496; }
  </style>
</head>
<body>

<div class="container">
  <h2>문서 정보 기반 정밀 파일명 자동 변경기</h2>

  <div class="rule-card">
    <h4>추출 위치 1 설정</h4>
    <div class="rule-grid">
      <div><label>기준 단어(키워드)</label><input type="text" id="key1" value="신청인"></div>
      <div><label>추출 위치</label><select id="dir1"><option value="after" selected>기준 단어 뒤</option><option value="before">기준 단어 앞</option></select></div>
      <div><label>중복 시 순번</label><select id="idx1"><option value="1" selected>첫 번째</option><option value="2">두 번째</option><option value="last">마지막</option></select></div>
      <div><label>추출 범위</label><select id="range1"><option value="word" selected>다음 공백 전까지</option><option value="line">해당 줄 끝까지</option></select></div>
    </div>
  </div>

  <div class="rule-card">
    <h4>추출 위치 2 설정</h4>
    <div class="rule-grid">
      <div><label>기준 단어(키워드)</label><input type="text" id="key2" value="기관명"></div>
      <div><label>추출 위치</label><select id="dir2"><option value="after" selected>기준 단어 뒤</option><option value="before">기준 단어 앞</option></select></div>
      <div><label>중복 시 순번</label><select id="idx2"><option value="1" selected>첫 번째</option><option value="2">두 번째</option><option value="last">마지막</option></select></div>
      <div><label>추출 범위</label><select id="range2"><option value="word">다음 공백 전까지</option><option value="line" selected>해당 줄 끝까지</option></select></div>
    </div>
  </div>

  <div class="rule-card">
    <h4>추출 위치 3 설정 (선택)</h4>
    <div class="rule-grid">
      <div><label>기준 단어(키워드)</label><input type="text" id="key3" value="" placeholder="미사용 시 비워둠"></div>
      <div><label>추출 위치</label><select id="dir3"><option value="after" selected>기준 단어 뒤</option><option value="before">기준 단어 앞</option></select></div>
      <div><label>중복 시 순번</label><select id="idx3"><option value="1" selected>첫 번째</option><option value="2">두 번째</option><option value="last">마지막</option></select></div>
      <div><label>추출 범위</label><select id="range3"><option value="word" selected>다음 공백 전까지</option><option value="line">해당 줄 끝까지</option></select></div>
    </div>
  </div>

  <div class="drop-zone" id="dropZone">
    파일을 드래그하여 이곳에 놓거나 클릭하여 선택하세요. (PDF, HWPX)
    <input type="file" id="fileInput" multiple accept=".pdf,.hwpx" style="display:none;">
  </div>

  <div class="action-bar">
    <div>
      <button class="btn btn-run" id="btnRun" onclick="runBatchProcess()" disabled>▶ 파일명 추출 및 변경 실행</button>
    </div>
    <div>
      <button class="btn btn-zip" id="btnZip" onclick="downloadAllZip()" disabled>📦 전체 ZIP 일괄 다운로드</button>
    </div>
  </div>

  <h3>업로드 파일 목록 및 실행 결과</h3>
  <table id="resultTable">
    <thead>
      <tr>
        <th style="width: 20%;">원본 파일명</th>
        <th style="width: 12%;">추출값 1</th>
        <th style="width: 12%;">추출값 2</th>
        <th style="width: 12%;">추출값 3</th>
        <th style="width: 24%;">변경될 파일명</th>
        <th style="width: 20%;">상태 / 개별 다운로드</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const btnRun = document.getElementById('btnRun');
  const btnZip = document.getElementById('btnZip');
  const resultTable = document.getElementById('resultTable').querySelector('tbody');

  let fileQueue = [];

  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.background = '#d0e3ff'; });
  dropZone.addEventListener('dragleave', () => { dropZone.style.background = '#e9f2ff'; });
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.style.background = '#e9f2ff';
    handleFiles(e.dataTransfer.files);
  });

  function handleFiles(files) {
    for (let file of files) {
      if (!fileQueue.some(item => item.file.name === file.name)) {
        const item = { file: file, status: 'ready', newName: '', processedBlob: null };
        fileQueue.push(item);
        renderRow(item);
      }
    }
    if (fileQueue.length > 0) btnRun.disabled = false;
  }

  function renderRow(item) {
    const row = resultTable.insertRow();
    row.id = `row-${item.file.name.replace(/[^a-zA-Z0-9]/g, '_')}`;
    row.innerHTML = `
      <td>${item.file.name}</td>
      <td class="val-1">-</td>
      <td class="val-2">-</td>
      <td class="val-3">-</td>
      <td class="val-new">-</td>
      <td class="val-status"><span class="status-badge status-ready">대기 중</span></td>
    `;
  }

  async function runBatchProcess() {
    btnRun.disabled = true;
    btnZip.disabled = true;

    const rules = [
      { key: document.getElementById('key1').value.trim(), dir: document.getElementById('dir1').value, idx: document.getElementById('idx1').value, range: document.getElementById('range1').value },
      { key: document.getElementById('key2').value.trim(), dir: document.getElementById('dir2').value, idx: document.getElementById('idx2').value, range: document.getElementById('range2').value },
      { key: document.getElementById('key3').value.trim(), dir: document.getElementById('dir3').value, idx: document.getElementById('idx3').value, range: document.getElementById('range3').value }
    ];

    for (let item of fileQueue) {
      if (item.status === 'success') continue; // 이미 처리된 경우 스킵

      const rowId = `row-${item.file.name.replace(/[^a-zA-Z0-9]/g, '_')}`;
      const row = document.getElementById(rowId);
      const statusCell = row.querySelector('.val-status');

      statusCell.innerHTML = `<span class="status-badge status-working">분석 중...</span>`;

      try {
        let fullText = "";
        if (item.file.name.endsWith('.pdf')) {
          fullText = await extractPdfText(item.file);
          if (fullText.trim().length < 20) {
            statusCell.innerHTML = `<span class="status-badge status-working">OCR 스캔 중...</span>`;
            fullText = await extractPdfOCR(item.file);
          }
        } else if (item.file.name.endsWith('.hwpx')) {
          fullText = await extractHwpxText(item.file);
        }

        const vals = rules.map(rule => parseTextByRule(fullText, rule));
        row.querySelector('.val-1').innerText = vals[0] || "-";
        row.querySelector('.val-2').innerText = vals[1] || "-";
        row.querySelector('.val-3').innerText = vals[2] || "-";

        const ext = item.file.name.substring(item.file.name.lastIndexOf('.'));
        const cleanBaseName = item.file.name.replace(ext, '');
        const validParts = vals.filter(v =>
